
name: Automatic Rollback

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for deployment and check health
        id: health
        run: |
          URL="https://main.digumu4vguf7o.amplifyapp.com/"
          for i in $(seq 1 18); do
            if curl -fsSL "$URL" -o page.html &&
               grep -q 'DEPLOYMENT_OK' page.html; then
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "healthy=false" >> "$GITHUB_OUTPUT"

      - name: Roll back failed commit
        if: steps.health.outputs.healthy == 'false' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git revert --no-edit "$GITHUB_SHA"
          git push origin main
